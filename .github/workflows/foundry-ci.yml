name: Foundry CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  quality-and-tests:
    name: Format, Build, Unit, Integration, Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install foundry-rs/forge-std --no-commit

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Unit tests
        run: forge test --match-path "test/unit/*.t.sol" -vv

      - name: Integration tests
        run: forge test --match-path "test/integration/*.t.sol" -vv

      - name: Fuzz tests
        run: forge test --match-path "test/fuzz/*.t.sol" -vv

  invariants:
    name: Invariant Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install foundry-rs/forge-std --no-commit

      - name: Invariant tests
        run: forge test --match-path "test/invariants/*.t.sol" -vv
